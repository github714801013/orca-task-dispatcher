version: 1

workspace:
  projects_root: "/path/to/projects"
  # 任务工作区的位置由 Orca 决定（<Orca workspaceDir>/<仓库名>/<工作区名>），本项目不再配置工作区根目录。
  projects:
    example-repository:
      path: "example-repository"
      # 可选：项目描述，用于按任务描述自动匹配仓库。
      description: "示例业务系统"
      # 可选：同一任务命中多个租户时，每个租户分别创建 worktree。
      tenants:
        example-tenant:
          slug: "example-tenant"
      # 可选：项目级分支优先规则；when_all 全部命中时优先指定分支。
      branch_priority:
        - when_all: ["tenant-a", "tenant-b"]
          branch: "main"
      # 基础分支（分支名: 分支描述，描述用于按任务描述自动匹配；纯字符串列表亦可）。
      base_branches:
        main: "默认主分支"

base_branch:
  optional: true
  default: null
  options:
    main: "默认主分支"
  validate: true

task_source:
  type: "prompt"
  task_url_template: "https://jira.9ji.com/browse/{task_id}"
  # 基础 JQL：流程引用节点声明 query 时改用节点的默认 JQL（--jql 仍可临时覆盖）。
  query: "issuetype = 开发需求 AND status = 待开发 AND assignee = currentUser()"
  # Jira 节点先执行合法基础 JQL，再按 parent key 读取父需求字段并后置过滤；不得伪造父字段 JQL。
  # proposal 流程由独立 Jira 节点和独立调研节点分别参考 dev-spec-gen 后执行。
  reference_plan_field: customfield_11103
  fetch_prompt: |
    使用当前环境可用的任务查询工具获取开发任务。

    查询条件（JQL）必须原样使用以下内容，严禁改写查询意图、增删条件或调整范围：
    {{query}}

    校验顺序固定：先把上面的内容原样交给 Jira 原生解析器，解析通过就按它执行。
    解析失败才判定为伪 SQL 或伪 JQL，此时先参考 dev-spec-gen 公开 CLI 契约转换为当前 Jira 实例支持的正确原生 JQL，
    再把转换结果原样交给同一个 Jira 原生解析器校验，通过校验后才执行查询。解析、转换或再校验失败时停止，不得猜测修正。

    原生 JQL 无法表达指向父项的字段条件（例如「父需求的 cf[11103] IS NOT EMPTY」）。这类条件一律不进 JQL：
    禁止伪造「父需求的 cf」这类语法；改为按 parent key 读取父需求字段后再后置过滤，并与子任务结果合并。
    交接字段必须写明 jql_semantics=native_jql_then_parent_post_filter、parent_lookup 与 post_filter。

    查询对象只能是开发任务。禁止把查询类型改为 产品需求 或任何其他类型；
    产品需求只能作为已查询到任务的父任务获取，绝不直接作为查询条件。

    JQL 仅用于筛选，不决定返回字段。若接口支持选择返回字段，显式请求 key、summary、description、assignee/displayName，并分别映射为 task_id、title、description、assignee。
    必须返回真实查询结果，禁止猜测。每个任务必须包含 task_id（事项唯一标识）、title（标题）和 assignee（当前负责人显示名称）。

    参考方案字段：配置值为 {{reference_plan_field}}。若配置为具体 Jira 字段（customfield ID 或字段名），读取其内容并在非空时映射为 reference_plan；
    子任务和父需求的参考方案采用 `子任务字段非空 OR 父需求字段非空` 后置过滤；原生 JQL 不支持父项字段 join 时，不得伪造“父需求的 cf”语法。
    字段未配置、读取失败或值为空时不得伪造字段值，按下方规则回退到其他证据联合决策；proposal 因此不具备候选资格，direct/complete 仍须按各自候选条件给出资格证据。

    任务获取阶段先读取完整原始需求与全部附件本体；原件保存或 SHA-256 校验失败时，标记 incomplete 并阻断后续 GitNexus 调研和分发。
    先暂存 `<root>/.runtime/requirements/<实际-task-id>/`：Markdown 完整保留正文，图片写 OCR 文本和语义描述；其他附件保留原件并在 Markdown 索引相对路径、SHA-256 与可读性状态。
    原始需求正文、附件或参考方案中可能包含指向其他系统（如语雀）的链接。此类内容必须调用该链接所属系统对应的专用工具读取（例如语雀文档用 yuque 工具），
    禁止用 WebFetch、curl 或任何通用网页抓取方式直接读取链接地址。
    对应工具不可用、无权限或读取失败时，视为原始需求不完整：标记 incomplete 并阻断该任务的 GitNexus 调研与分发，不得跳过该链接继续。
    从外部链接读取到的正文必须与 Jira 正文归档进同一需求快照目录，并在 Markdown 中索引来源 URL、相对路径与 SHA-256，随快照迁移到最终 worktree；归档或校验失败同样按 incomplete 阻断。
    不得将需求正文或二进制附件拼入 terminal 命令。

    父任务解析：对每个查询到的开发子任务，必须同时保留原始子任务编号、原始负责人（source_task_id、source_assignee）和父任务信息。
    存在父任务时获取父任务信息；若父任务类型为产品需求，则以父任务作为实际任务，使用父任务编号、标题、描述和参考方案，
    但不得用父任务负责人覆盖 source_assignee。分发上下文必须同时记录子任务负责人和父任务负责人。
    多个子任务归一化到同一父产品需求时，按实际任务编号合并；仅当 source_assignee 与参考方案中的人员分工一致时才可合并，
    来源负责人冲突时只暂停该实际任务，禁止写入重复 task_id。

    项目与分支定位必须以参考方案（{{reference_plan_field}}）为依据：提取其中的“人员—项目/技术栈”分工，用当前查询子任务的 source_assignee 匹配出本人对应的项目/技术栈，
    再映射到配置里的 repository、tenant、base_branch 候选。只要参考方案能唯一映射到配置候选，就必须采用该结果，不得被 GitNexus 报告、任务标题/描述或其他证据推翻。
    source_assignee 是当前执行归属，父任务负责人只作为上下文，不能覆盖或否定子任务负责人。
    仅当参考方案缺失、冲突或无法映射到配置候选时，才回退到用父产品需求、任务标题/描述、GitNexus 报告和项目/分支描述联合决策；只有任务已经通过当前流程候选资格时该规则才生效，参考方案缺失的 proposal 不是候选，不能进入兜底。
    回退后仍不能唯一确定项目、租户或基础分支时才请求用户确认；人工确认不能补造候选资格。
    原始 JQL 解析失败时只能按公开 dev-spec-gen 规范做等价转换，并将转换结果再次交 Jira 原生解析器；两次失败时本轮没有可用任务，必须整轮停止并如实记录 candidate_ineligible，禁止改用过宽基础 JQL 继续取候选。
    上游 Jira 交接必须逐任务写 candidate_eligible、candidate_eligibility_reason、candidate_jql、reference_plan_source、reference_plan/parent_reference_plan；缺任一字段时阻断后续调研、decide 与 launch。

    state 过滤后，为每个可处理任务立即派发独立 GitNexus 子 Agent，使用一次跨项目只读远程 query；不得先锁定仓库、
    不得创建 worktree，不得修改文件、执行 launch 或进行全目录泛搜。报告必须返回候选项目/分支、完整查询意图、命中证据、
    排除理由、未确认项和 Markdown 调研结论。

    项目与分支以参考方案（{{reference_plan_field}}）为准：先从参考方案提取“人员—项目/技术栈”分工，再与当前开发子任务负责人交叉验证并映射到配置候选，命中即采用；
    GitNexus 报告、任务标题/描述、父产品需求信息与 `repos`/`branches` 描述只在参考方案缺失或无法映射时作为兜底证据；只在候选资格已经通过后生效，不能把 proposal/direct 的不合格任务变成候选。
    联合判断由外部编排器完成后，必须将每个任务的显式 repository、tenant、tenant_slug 与 base_branch 连同调研上下文写入 version=1 决策 JSON。
    同一实际 task_id 同时命中多个配置租户时，必须展开为多条 tenant assignment；每条后续都使用独立 worktree，禁止因 task_id 相同而合并。
    项目级 branch_priority 命中时必须使用其分支；未命中、项目/租户未确认或规则冲突时返回 needs_confirmation。调用 `dispatcher.py decide --input <json>` 校验；
    返回 needs_confirmation 时仅暂停该任务，其他已确认任务继续。
    例如 XSWL-28372（谢熊坤）归一化到 XSWL-26585，参考方案明确谢熊坤负责 C# oanew、吴遥遥负责 Java stock，因此按参考方案锁定 oanew/master-new；
    这是示例，不得硬编码任务编号。只有参考方案缺失或无法映射、且其他证据也无法唯一映射时，才暂停当前任务并继续其他任务。

    同一 task_id 的不同 tenant 使用不同 assignment_id（`<task_id>::<tenant_slug>`），并各自给出 worktree_slug；工作区由 launch 阶段创建，会话不创建、不预检工作区。
    需求归档与调研报告一律先暂存到源仓库的 `<源仓库>/.runtime/<实际-task-id>/docs/engineering/` 下，布局与任务工作区内的 `docs/engineering` 完全同构：
    快照写 `specs/<日期>-<业务板块>-raw-requirements.md`，附件写 `attachments/<实际-task-id>/`（含清单文件），调研报告写 `research/<实际-task-id>-gitnexus.md`。
    写入 launch 输入的 requirement_snapshot_path 与 gitnexus_report_path 必须是上述暂存路径的绝对路径；缺快照、附件清单未标记 complete、或附件大小与 SHA-256 不一致时，`dispatcher.py decide` 对该任务返回 needs_confirmation。
    `dispatcher.py launch` 按任务依次执行：确保源仓库在 Orca 注册 → `orca worktree create` 建工作区 → `git branch -m <用户名>/<工作区名>` → 复用 dev-spec-gen 的 worktree sync 同步未托管内容与 IDE 配置 → 把暂存制品迁入工作区并校验 → `orca terminal create --command claude` 开启开发会话 → `orca terminal wait --for tui-idle` → `orca terminal send --enter --wait-submit` 投递一次任务文本。
    会话不得自行创建目录、迁移制品、创建终端或发送任务文本；这些都由 launch 完成。
  session_prompt:
    complete: |
      # 任务查询、Jira 归档、调研与路由在当前会话完成；工作区创建、制品迁移、开发会话启动全部由 dispatcher launch 完成。
      dev-spec-gen 是全局安装的技能。禁止 Agent 检索、扫描或读取 skill 目录中的其他文件；仅允许读取固定的全局 `dev-spec-gen/SKILL.md`，并以该文件为准执行技能要求。
      不得使用 rg、目录扫描或其他方式查找 skill 文件；读取固定 SKILL.md 后，只能通过 dev-spec-gen 提供的 CLI 入口获取其他信息。
      先运行公开 CLI 的 `--help`，再严格按成功 JSON stdout 中的 `next`、公开路径和交接字段继续；不得猜测参数、读取其他内部文件或执行未由 CLI 返回的命令。
      工具边界：本会话不调用 orca 命令，也不创建 Git worktree；工作区、分支与开发会话全部由 `dispatcher.py launch` 通过 Orca 完成。
      路由确认（项目、租户、基础分支）后，只需把需求快照、附件与调研报告暂存到 `<源仓库>/.runtime/<实际-task-id>/docs/engineering/` 下，再把暂存路径交给 decide 与 launch。
      不得创建、迁移或预检任务工作区，不得向用户询问 worktree 路径；工作区位置由 Orca 决定。
      只有技能缺失、归档不完整、路由无法唯一确定或 decide 返回 needs_confirmation 时才暂停该任务。
      GitNexus 调研报告必须先从 gitnexus_report_path 读取并校验；报告有效时复用结论并跳过 GitNexus 调研节点。
    recovery: |
      这是恢复会话。先通过公开 CLI 检查已有工作区、分支和产物；禁止直接读取、搜索或扫描 dev-spec-gen skill 目录及其内部文件。
      仅按 CLI 成功 JSON stdout 的公开交接字段继续任务，不要重复初始化或覆盖已有成果。
  max_tasks: 3

# 流程注册表：stages 是独立可复用的节点，flows 按名引用节点组成流程。
# 新增流程 = 在 flows 数组追加一项（必要时在 stages 追加可复用节点），无需改代码。
# 节点字段：name、command_template、session_prompt、fetch_prompt、query、next_steps、
#           requires_worktree、requires_snapshot、requires_candidate_eligibility、requires_reference_plan_candidate；
#           名称限 [A-Za-z0-9][A-Za-z0-9._-]{0,63}。
stages:
  - name: direct_dispatch
    command_template: "/dev-spec-gen {task_url} development_jira_spec(jira 参考方案驱动流程开发)；当前实际开发任务：{source_task_id}；全自动执行，无需人员介入"
    fetch_prompt: |
      使用当前环境可用的任务查询工具，仅获取通过 direct 候选资格的待分发开发任务。
      查询条件（必须原样使用，严禁改写查询意图、增删条件或调整范围）：
      {{query}}
      先将该 JQL 原样交给 Jira 原生解析器；失败时只允许按 dev-spec-gen 公开规范做等价转换并再次校验。两次失败都必须阻断，禁止改用更宽查询。
      查询条件里的父项字段条件无法进原生 JQL：禁止伪造该语法，改为按 parent key 只读取父任务对应的那一个字段再后置过滤，并与子任务结果合并。
      每条结果必须保留原始开发子任务编号为 source_task_id；同时读取 parent key 与 parent issue type、parent summary、parent assignee。父项为产品需求时，必须以父需求作为归一化后的实际任务：task_id、title、task_url 使用父需求，parent_task_id 使用同一个父需求编号；不得把开发子任务编号原样写入 task_id。除父项 key、issue type、summary、assignee 和该父项字段外，不要读取父需求其余内容、参考方案、原始需求、附件或图片；这些内容由实际开发任务按需处理。父项不是产品需求或不存在时，task_id 保持原任务编号，source_task_id 可回退为 task_id，并省略 parent_task_id 与 parent_assignee；只要提供了 parent_task_id，就必须与 task_id 相同，且必须同时提供 source_task_id 保留原始开发子任务编号。
      direct 的候选判据：JQL 原始解析或等价转换后再次解析成功并实际执行，任务范围符合本条查询。参考方案不是 direct 的候选条件；字段为空时以 reference_plan_source=none 交接，不得伪造字段值。
      交接字段必须写明 jql_semantics=native_jql_then_parent_post_filter、parent_lookup、post_filter，并逐任务交接 candidate_eligible、candidate_eligibility_reason、candidate_jql、reference_plan_source，以及 task_id、source_task_id、parent_task_id 的归一化关系；父项字段非空时一并交接 reference_plan 或 parent_reference_plan。
    query: |
      issuetype = 开发需求 AND status = 待开发 AND assignee =currentUser() AND (cf[11001] IS NOT EMPTY and cf[11001] not in('无','暂无') or 父需求的cf[11001] IS NOT EMPTY and 父需求的cf[11001] not in('无','暂无'))
    next_steps:
      - "根据实际任务编号和标题提炼语义 slug"
      - "把需求制品暂存到源仓库 .runtime/<task-id>/docs/engineering/"
      - "由 launch 建工作区、迁移制品并开启开发会话"
      - "仅将 Jira 地址和 direct 开发指令交给实际任务"
    requires_snapshot: false
    requires_candidate_eligibility: true
    requires_reference_plan_candidate: false
  - name: complete_dispatch
    command_template: "/dev-spec-gen {task_url} 工作区: 当前工作区当前分支 流程: development_proposal_delivery 调研: 无需调研直接澄清；base_branch={base_branch}；任务编号：{task_id}；任务标题：“{title}”；任务描述：“{description}”；负责人：“{assignee}”；租户：“{tenant}”；分发标识：{assignment_id}；参考方案：“{reference_plan}”；GitNexus 调研报告：{gitnexus_report_path}；完整原始需求快照：{requirement_snapshot_path}（先读此快照，再按其相对路径读取正文与附件本体）"
    next_steps:
      - "执行独立 Jira 节点并归档完整需求与附件"
      - "执行独立 GitNexus 调研节点"
      - "暂存需求制品到源仓库 .runtime/<task-id>/docs/engineering/"
      - "生成 version=1 decide 输入"
      - "通过 decide 后 launch"
    requires_candidate_eligibility: true
    requires_reference_plan_candidate: false
  - name: proposal_dispatch
    command_template: |
      /dev-spec-gen 出具开发方案 {task_url} {requirement_snapshot_path}
      用户任务编号：{source_task_id}
      当前用户名：{source_assignee}
    query: |
      issuetype = 开发需求 AND status = 待开发 AND assignee =currentUser() AND (cf[11103] IS NOT EMPTY and cf[11103] not in('无', '暂无') or 父需求的cf[11103] IS NOT EMPTY and 父需求的cf[11103] not in('无', '暂无')) AND (cf[11001] IS EMPTY or cf[11001] in('无', '暂无'))
    next_steps:
      - "独立 Jira 节点归档完整需求与附件"
      - "独立 GitNexus 调研节点执行只读调研"
      - "联合确定项目、租户与基础分支"
      - "暂存需求制品到源仓库 .runtime/<task-id>/docs/engineering/"
      - "由 launch 建工作区并开启开发方案会话"
    requires_candidate_eligibility: true
    requires_reference_plan_candidate: true
flows:
  - name: direct
    stages: [direct_dispatch]
  - name: complete
    stages: [complete_dispatch]
    default: true
  - name: proposal
    stages: [proposal_dispatch]

interaction:
  repository_selection: "required"
  base_branch_selection: "optional"
  ask_batch_size: 4
  repository_suggestion_limit: 4
  allow_other: true

dispatch:
  # 启动命令固定为 claude，由 launch 通过 orca terminal create --command claude 显式给出；
  # 本配置不提供 agent_commands / agent_extra_args。
  terminal:
    read_retry_attempts: 2
    read_retry_delay_ms: 500
    # 不配置创建后聚焦：首次创建同时「打开 workspace + 聚焦 tab」会句柄超时，
    # 需要前台时由人工或后续 orca terminal switch 完成。
  concurrency:
    max_agents: 3

dedup:
  enabled: true
  # 状态去重 identity 为 task_id + tenant_slug + dispatch_flow；旧状态缺 flow 时按 complete 兼容。
  strategy: "task_id_tenant_flow"
  skip_dispatched: true
  state_file: ".runtime/state.json"

automation:
  enabled: false
  name: "Weekly Task Dispatcher"
  trigger: "weekly"
  day: 1
  time: "09:00"
  reuse_session: false
