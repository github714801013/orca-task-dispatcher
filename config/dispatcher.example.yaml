# 仅配置不同电脑上的项目根目录与项目相对路径；其余配置由 dispatcher.default.yaml 托管。
version: 1

workspace:
  projects_root: "/path/to/projects"
  projects:
    example-repository:
      # 支持相对 projects_root 的路径，也支持越出 projects_root 的绝对仓库路径。
      path: "example-repository"
      # 可选：项目描述，用于按任务描述自动匹配仓库。
      description: "示例业务系统"
      # 可选：同一任务命中多个租户时，每个租户分别创建 worktree。
      tenants:
        example-tenant:
          slug: "example-tenant"
      # 可选：项目级分支优先规则；when_all 全部命中时优先指定分支。
      branch_priority:
        - when_all: ["tenant-a", "tenant-b"]
          branch: "main"
      # 基础分支（分支名: 分支描述，描述用于按任务描述自动匹配；纯字符串列表亦可）。
      base_branches:
        main: "默认主分支"
